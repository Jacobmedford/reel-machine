<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>counter-loupe</title>
<link rel="stylesheet" href="brand.css" />
<link rel="stylesheet" href="card.css" />
<style>
  /* counter-loupe: a big figure rolls up to a small change, the bar shows how small it is to scale, and a loupe glides
     in and focuses on the sliver that is the change. The sliver is the accent; the rest of the bar is the dark ground. */
  #cam { transform-origin:540px 700px; }

  #kick { position:absolute; left:70px; top:262px; line-height:30px; }

  /* the big figure: every digit sits in a fixed 1ch cell so the roll never changes width, whatever the display face */
  #fig { position:absolute; left:56px; top:336px; font-size:236px; color:var(--c-ink); font-feature-settings:'lnum' 1, 'tnum' 1; }
  #fig .dg { display:inline-block; width:1ch; text-align:center; }
  #sub { position:absolute; left:70px; top:610px; font-weight:500; font-size:34px; color:color-mix(in srgb, var(--c-ink) 80%, transparent); }

  /* the bar: the whole in the dark ground colour + the accent sliver (the last 1.6% of its length) */
  #axis { position:absolute; left:69px; top:768px; width:2px; height:174px; background:var(--c-ink); }
  .base { position:absolute; left:70px; top:800px; width:767.52px; height:110px; background:var(--c-dark); }
  .sliver { position:absolute; left:837.52px; top:800px; width:12.48px; height:110px; background:var(--c-accent-light); border-radius:0 var(--radius) var(--radius) 0; }
  #val { position:absolute; left:98px; top:800px; height:110px; line-height:110px; font-size:44px; color:var(--c-light); letter-spacing:.01em; }

  /* loupe: a true magnifier whose lens is centred on the sliver (843.76, 855), r 145 */
  #loupe { position:absolute; left:698.76px; top:710px; width:290px; height:290px; }
  #lens { position:absolute; left:0; top:0; width:290px; height:290px; clip-path:circle(145px at 145px 145px); }
  #world { position:absolute; left:-698.76px; top:-710px; width:1600px; height:1920px; }
  #rim { position:absolute; left:0; top:0; width:290px; height:290px; overflow:visible; }
  #rim circle { fill:none; stroke:var(--c-ink); }
  #rim rect { fill:var(--c-ink); }

  #tag { position:absolute; left:693.76px; top:1024px; width:300px; text-align:center; }
  #tag span { display:inline-block; font-size:34px; line-height:34px; color:var(--c-accent-light); }

  #foot { position:absolute; left:70px; top:1112px; }
</style>
</head>
<body>
<div id="root" class="ground-light" data-composition-id="main" data-start="0" data-duration="2.900" data-fps="30" data-width="1080" data-height="1920">
  <div id="cam" class="layer">
    <!-- the paper lives inside the camera so the lens can copy it exactly -->
    <div id="paper" class="layer ground-light"></div>

    <div id="kick" class="kicker">Revenue in 2025 · creator business</div>
    <div id="fig" class="display">+0.0%</div>
    <div id="sub" class="text">added by one video that went viral</div>

    <div id="axis"></div>
    <div id="base" class="base"></div>
    <div id="sliver" class="sliver"></div>
    <div id="val" class="mono">$186K</div>

    <div id="loupe" data-layout-allow-overflow>
      <div id="lens">
        <!-- a copy of the world under the lens (paper + bar), magnified around the lens centre -->
        <div id="world">
          <div class="ground-light" style="position:absolute;left:0;top:0;width:1600px;height:1920px;"></div>
          <div class="base"></div>
          <div class="sliver"></div>
        </div>
      </div>
      <svg id="rim" viewBox="0 0 290 290">
        <circle cx="145" cy="145" r="145" stroke-width="3"/>
        <g transform="rotate(45 145 145)">
          <rect x="291" y="138" width="84" height="14" rx="4"/>
        </g>
      </svg>
    </div>

    <div id="tag"><span class="mono">+$2.9K</span></div>
    <div id="foot" class="foot">Source: sample business data, 2025</div>
  </div>
</div>
<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  var FPS = 30;
  var tl = gsap.timeline({ paused: true });
  function q(t) { return Math.round(t * FPS) / FPS; }
  /* count a number with a fixed format; digits go into fixed-width cells (see #fig .dg) so widths never jitter */
  function count(sel, from, to, t0, dur, dec, pre, suf, ease) {
    var el = document.querySelector(sel), o = { v: from };
    var fmt = function (v) { return (pre || '') + v.toFixed(dec || 0) + (suf || ''); };
    var put = function (s) { el.innerHTML = s.replace(/[0-9]/g, '<span class="dg">$&</span>'); };
    put(fmt(from));
    tl.to(o, { v: to, duration: dur, ease: ease || 'power2.out', onUpdate: function () { put(fmt(o.v)); } }, q(t0));
  }

  // ---- loupe: glides in as clear glass (1x), lands, then focuses to 6x around the sliver ----
  var MAG = 6;
  var DX = 400, DY = 90;                         // start offset: fully off the right edge
  var T0 = q(1.733), TG = 0.30;                  // glide, landing on its word (1.79)
  var TZ0 = q(1.9), TZ = q(0.333);               // focus 1x -> 6x (frames 57-67), ~4x by 2.03
  var EG = gsap.parseEase('power3.out'), EZ = gsap.parseEase('power3.out');
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function loupeAt(t) {                          // t = seconds since T0; pure function of t
    var d = 1 - EG(clamp(t / TG));
    var m = Math.pow(MAG, EZ(clamp((t - (TZ0 - T0)) / TZ)));   // log-space: the zoom reads even
    var dx = DX * d, dy = DY * d;
    gsap.set('#loupe', { x: dx, y: dy });
    gsap.set('#rim', { rotation: 7 * d });
    // world point under the lens centre stays under the lens centre: translate = -m * offset
    gsap.set('#world', { scale: m, x: -m * dx, y: -m * dy });
  }
  gsap.set('#rim', { transformOrigin: '145px 145px' });
  gsap.set('#world', { transformOrigin: '843.76px 855px' });
  loupeAt(0);

  // other initial states
  gsap.set('#base',   { scaleX: 0, transformOrigin: '0% 50%' });
  gsap.set('#sliver', { scaleX: 0, transformOrigin: '0% 50%' });
  gsap.set('#val',    { opacity: 0 });
  gsap.set('#tag',    { opacity: 0, y: 12 });

  // one slow camera push across the whole card
  tl.fromTo('#cam', { scale: 1 }, { scale: 1.025, duration: 2.9, ease: 'none' }, 0);

  // the whole (0.03): the bar grows in from the zero axis, frames 0-12
  tl.to('#base', { scaleX: 1, duration: q(0.4), ease: 'expo.out' }, 0);
  tl.to('#val', { opacity: 1, duration: 0.3, ease: 'power2.out' }, q(0.13));

  // the figure (0.67): rolls 0.0 -> 1.6 while the accent sliver (the change) grows by ~12px
  count('#fig', 0, 1.6, 0.633, 0.6, 1, '+', '%', 'power1.out');          // reads +1.6% from ~1.13
  tl.to('#sliver', { scaleX: 1, duration: 0.6, ease: 'power1.out' }, q(0.633));

  // the small word (1.79): loupe glides on, then focuses so the sliver swells to ~75px
  var pr = { t: 0 }, TL = (TZ0 - T0) + TZ;
  tl.to(pr, { t: TL, duration: TL, ease: 'none', onUpdate: function () { loupeAt(pr.t); } }, T0);

  // the payoff word (2.27): the small label under the loupe
  tl.to('#tag', { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, q(2.167));

  window.__timelines['main'] = tl;
})();
</script>
</body>
</html>
