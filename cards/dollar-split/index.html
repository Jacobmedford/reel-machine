<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dollar split</title>
<link rel="stylesheet" href="brand.css" />
<link rel="stylesheet" href="card.css" />
<link rel="preload" as="image" href="bill.jpg" />
<style>
  #cam { transform-origin:540px 640px; }
  #kick { position:absolute; left:70px; top:262px; }
</style>
</head>
<body>
<!-- Dollar split, part 1 of 2: a real $1 bill is ruled into 100 cents, the left share inks 60 of them, the right share
     the other 40, then the bill is cut on the line. index-followup.html continues from this card's last frame (the
     split shifts to 45/55). The shared drawing, the share words and the colours live in dollar.js. -->
<div id="root" class="ground-light" data-composition-id="main" data-start="0" data-duration="4.933" data-fps="30" data-width="1080" data-height="1920">
  <div id="cam" class="layer">
    <div id="kick" class="kicker">Of every $1 a customer pays · Today</div>
    <svg id="dollar" class="layer" viewBox="0 0 1080 1920"></svg>
  </div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="dollar.js"></script>
<script>
(function () {
  var FPS = 30, DUR = 4.933;
  var RATE = 0.0045;                          // camera push per second, continued by index-followup.html
  function q(t) { return Math.round(t * FPS) / FPS; }
  var D = window.Dollar, clamp = D.clamp;

  D.ready(function () {
    var tl = gsap.timeline({ paused: true });
    var E = { p2o: gsap.parseEase('power2.out'), p3o: gsap.parseEase('power3.out'), xo: gsap.parseEase('expo.out'), p2io: gsap.parseEase('power2.inOut') };
    function P(t, t0, d, e) { var x = (t - q(t0)) / d; x = x < 0 ? 0 : (x > 1 ? 1 : x); return e ? e(x) : x; }
    D.build(document.getElementById('dollar'));

    var W = 4;                                   // width of the tint front, in cents
    function state(t) {
      var pl = P(t, 0.70, 0.55, E.p3o);          // 0.70: cents 1-60 take the left share's ink
      var pr = P(t, 2.00, 0.40, E.p3o);          // 2.00: cents 61-100 take the accent
      var F = pl * (59 + W), G = pr * (39 + W);
      return {
        div: function (k) { return E.p2o(P(t, 0.06 + (k - 1) * 0.004, 0.22)); },   // 0.06: the bill is ruled into cents
        ink: function (i) { return i < 60 ? E.p2o(clamp((F - i) / W)) : 0; },
        acc: function (i) { return i >= 60 ? E.p2o(clamp((G - (i - 60)) / W)) : 0; },
        neg: null, negSpan: null,
        B: 60,
        cut: P(t, 3.12, 0.24, E.p3o),            // 3.12: a clean cut down the 60/40 line
        g: D.L.gap * P(t, 3.38, 0.72, E.p2io),   // 3.38: the two pieces ease apart
        lNum: 60 * pl, rNum: 40 * pr,
        lA: P(t, 0.68, 0.25, E.p3o), lY: 18 * (1 - P(t, 0.68, 0.40, E.p3o)),
        rA: P(t, 1.98, 0.25, E.p3o), rY: 14 * (1 - P(t, 1.98, 0.40, E.p3o)),
        lTag: P(t, 0.66, 0.42, E.p3o), rTag: P(t, 1.96, 0.40, E.p3o),
        rLabA: P(t, 2.55, 0.35, E.p3o), rLabY: 14 * (1 - P(t, 2.55, 0.45, E.p3o)),
        lLabA: P(t, 4.00, 0.35, E.p3o), lLabY: 14 * (1 - P(t, 4.00, 0.45, E.p3o)),
        br: P(t, 1.88, 0.50, E.xo), brA: P(t, 1.90, 0.30, E.p3o)
      };
    }
    var T = { t: 0 };
    D.paint(state(0));
    tl.fromTo(T, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: function () { D.paint(state(T.t)); } }, 0);
    tl.fromTo('#cam', { scale: 1 }, { scale: 1 + RATE * DUR, duration: DUR, ease: 'none' }, 0);

    window.__timelines['main'] = tl;
    if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
  });
})();
</script>
</body>
</html>
