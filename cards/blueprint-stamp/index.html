<style>
  /* the plan sheet is the pack's dark ground (graph paper when the pack has it); #paper overhangs the frame so the
     stamp's shake never shows an edge */
  #shake { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  #paper { position:absolute; left:-40px; top:-40px; width:1160px; height:2000px; background-position:40px 40px; }
  #cam   { transform-origin:540px 700px; }
  #kick  { position:absolute; left:70px; top:248px; }

  /* drawing: every stroke in the light colour, 2px; hierarchy by opacity only */
  .dwg path { fill:none; stroke-width:2; stroke-linejoin:miter; }
  .s0 { stroke:var(--c-light); }
  .h  { stroke:color-mix(in srgb, var(--c-light) 28%, transparent); }
  .s1 { stroke:var(--c-light); }
  .w  { stroke:color-mix(in srgb, var(--c-light) 90%, transparent); }
  .s2 { stroke:color-mix(in srgb, var(--c-light) 55%, transparent); }
  .d  { stroke:color-mix(in srgb, var(--c-light) 45%, transparent); }
  .dwg text { fill:color-mix(in srgb, var(--c-light) 62%, transparent); font-size:24px; font-weight:500; letter-spacing:.02em; }

  /* title block: two steps ticked off in the accent */
  .lab  { position:absolute; display:flex; align-items:center; font-size:30px; letter-spacing:.12em; color:var(--c-light); line-height:1; }
  .lab svg { width:34px; height:30px; margin-left:12px; overflow:visible; }
  .lab path { fill:none; stroke:var(--c-accent); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  #sheet { position:absolute; right:70px; top:1072px; }

  /* rubber stamp: double hairline rectangle, heavy caps, in the negative colour (red stamp ink in most packs) */
  .stamp { position:absolute; left:303px; top:656px; width:474px; height:128px; border:3px solid var(--c-neg); border-radius:var(--radius); }
  .stamp .in { position:absolute; left:5px; top:5px; right:5px; bottom:5px; border:1.5px solid var(--c-neg); border-radius:max(0px, calc(var(--radius) - 4px));
               display:flex; align-items:center; justify-content:center; }
  .stamp .ink { font-weight:800; font-size:62px; letter-spacing:.08em; padding-left:.08em; color:var(--c-neg); line-height:1; }
</style>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  var FPS = 30, DUR = 68 / FPS;
  var tl = gsap.timeline({ paused: true });
  function q(t) { return Math.round(t * FPS) / FPS; }
  function f(n) { return n / FPS; }                               // frame -> seconds
  function draw(sel, t0, dur, ease) {
    var p = document.querySelector(sel), L = Math.ceil(p.getTotalLength()) + 2;
    gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
    tl.to(p, { strokeDashoffset: 0, duration: dur, ease: ease || 'power2.inOut' }, q(t0));
  }

  // hidden initial states
  gsap.set(['#lab1', '#lab2'], { opacity: 0 });
  gsap.set('#stamp', { rotation: -11, scale: 1.8, opacity: 0, transformOrigin: '50% 50%' });
  gsap.set('#ghost', { rotation: -8, x: 5, y: 4, opacity: 0, transformOrigin: '50% 50%' });

  // one slow camera push across the whole card
  tl.fromTo('#cam', { scale: 1 }, { scale: 1.025, duration: DUR, ease: 'none' }, 0);

  // 0.39: the time-lapse starts, staggered and accelerating, every line down by 1.20
  var N = 96, T0 = 0.39, A = 0.73, P = 2.4;
  for (var i = 0; i < N; i++) {
    var el = document.getElementById('e' + i), u = i / (N - 1);
    var t = T0 + A * (1 - Math.pow(1 - u, P));
    var d = 0.24 - 0.18 * Math.pow(u, 0.8);
    if (el.tagName.toLowerCase() === 'path') {
      var L = Math.ceil(el.getTotalLength()) + 2;
      gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
      tl.to(el, { strokeDashoffset: 0, duration: d, ease: 'power2.out' }, t);
    } else {
      gsap.set(el, { opacity: 0 });
      tl.to(el, { opacity: 1, duration: 0.07, ease: 'none' }, t);
    }
  }

  // 1.067: step one + tick
  tl.fromTo('#lab1', { y: 10 }, { y: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, q(1.067));
  tl.to('#lab1', { opacity: 1, duration: 0.1, ease: 'none' }, q(1.067));
  draw('#tick1', 1.067, 0.14, 'power2.inOut');

  // 1.50 (frame 45): the stamp slams (scale 1.8 -> 1 over frames 45-49), ink offset frame, card shake
  tl.to('#stamp', { opacity: 1, duration: f(2), ease: 'none' }, f(45));
  tl.to('#stamp', { scale: 1, rotation: -8, duration: f(4), ease: 'power2.in' }, f(45));
  tl.set('#ghost', { opacity: 0.45 }, f(48.5));
  tl.set('#ghost', { opacity: 0 }, f(49.5));
  [[49, -3, 6], [50, 4, -4], [51, -2, 3], [52, 1, -1], [53, 0, 0]].forEach(function (s) {
    tl.set('#shake', { x: s[1], y: s[2] }, f(s[0] - 0.5));
  });
  tl.to('#stamp', { opacity: 0.92, duration: 0.25, ease: 'none' }, f(50));

  // 1.667: step two + tick, just after the slam
  tl.fromTo('#lab2', { y: 10 }, { y: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, q(1.67));
  tl.to('#lab2', { opacity: 1, duration: 0.1, ease: 'none' }, q(1.67));
  draw('#tick2', 1.70, 0.16, 'power2.out');

  window.__timelines['main'] = tl;
})();
</script>
