<!-- file-drop: the raw file goes in. A dashed drop zone opens, the file card (name, length, size) falls into it and the
     zone takes it, its thumbnail opens into a player of the raw footage, BAD TAKE stamps slam onto it, a label sets up
     the length. fx.js fills in the words. The player's clip is the <video> below: the build times it from A through
     the whole window; data-media-start is a time inside its file, data-playback-rate its speed. Here it is this
     video's own clean.mp4 from 1 s in at 2.3x, ungraded (raw); for real filler see fx.js. -->
<div id="{{ID}}-g" data-layout-allow-overlap data-layout-allow-occlusion>
  <div id="{{ID}}-zone">
    <svg id="{{ID}}-dash" width="800" height="500" viewBox="0 0 800 500"><rect x="20" y="20" width="760" height="460"/></svg>
    <div id="{{ID}}-hint" data-layout-allow-overlap>
      <svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 8v32M19 28l13 13 13-13"/><path d="M10 40v12h44V40"/></svg>
      <div id="{{ID}}-ht"></div>
    </div>
  </div>
  <div id="{{ID}}-card" data-layout-allow-overlap>
    <img id="{{ID}}-th" src="fx/{{ID}}/thumb.jpg" alt="">
    <div id="{{ID}}-meta">
      <div id="{{ID}}-name"></div>
      <div id="{{ID}}-info"></div>
    </div>
  </div>
  <div id="{{ID}}-pl" data-layout-allow-overlap data-layout-allow-occlusion>
    <video id="{{ID}}-v" src="clean.mp4" muted playsinline data-start="{{START}}" data-media-start="1.0010"
      data-duration="{{DUR}}" data-playback-rate="2.3" data-track-index="{{T0}}"></video>
    <div id="{{ID}}-ff"><svg width="26" height="16" viewBox="0 0 26 16"><path d="M0 0l12 8-12 8zM13 0l12 8-12 8z"/></svg><span></span></div>
    <div id="{{ID}}-bar"><i id="{{ID}}-fill"></i></div>
    <div class="{{ID}}-st" id="{{ID}}-s1" data-layout-allow-overlap data-layout-allow-occlusion></div>
    <div class="{{ID}}-st" id="{{ID}}-s2" data-layout-allow-overlap data-layout-allow-occlusion></div>
  </div>
  <div id="{{ID}}-lb" data-layout-allow-overlap><b></b> <span></span></div>
</div>
<style>
#{{ID}}-g { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:540px 540px; }
#{{ID}}-zone { position:absolute; left:140px; top:290px; width:800px; height:500px; border-radius:calc(var(--radius) * 3);
  background:var(--c-dark); box-shadow:0 18px 44px color-mix(in srgb, var(--c-dark) 40%, transparent); transform-origin:400px 250px; }
#{{ID}}-dash { position:absolute; left:0; top:0; }
#{{ID}}-dash rect { fill:none; stroke:var(--c-light); stroke-opacity:.5; stroke-width:3; stroke-dasharray:18 12;
  rx:max(0px, calc(var(--radius) * 3 - 12px)); }
#{{ID}}-hint { position:absolute; left:0; top:150px; width:800px; text-align:center; color:var(--c-light);
  font-family:var(--font-text); font-weight:600; font-size:36px; line-height:1; letter-spacing:-.02em; white-space:nowrap; }
#{{ID}}-hint svg { display:block; margin:0 auto 22px; }
#{{ID}}-hint path { fill:none; stroke:var(--c-accent); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
#{{ID}}-card { position:absolute; left:250px; top:474px; width:580px; height:132px; box-sizing:border-box;
  border-radius:calc(var(--radius) * 2); background:var(--c-light); box-shadow:0 16px 36px color-mix(in srgb, var(--c-dark) 36%, transparent);
  display:flex; align-items:center; gap:22px; padding:0 26px 0 16px; }
#{{ID}}-th { width:56px; height:100px; border-radius:max(2px, var(--radius)); object-fit:cover; display:block; flex:none; }
#{{ID}}-meta { min-width:0; }
#{{ID}}-name { font-family:var(--font-text); font-weight:var(--text-weight); font-size:34px; line-height:1.1; letter-spacing:-.025em;
  color:var(--c-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#{{ID}}-info { margin-top:10px; font:500 21px/1 var(--font-mono); letter-spacing:.04em; color:var(--c-muted-light); white-space:nowrap; }
#{{ID}}-pl { position:absolute; left:371px; top:230px; width:338px; height:600px; box-sizing:border-box; overflow:hidden;
  border-radius:calc(var(--radius) * 2); background:var(--c-dark); border:3px solid var(--c-light);
  box-shadow:0 18px 44px color-mix(in srgb, var(--c-dark) 40%, transparent); transform-origin:0 0; }
#{{ID}}-v { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }
#{{ID}}-ff { position:absolute; right:12px; top:12px; display:flex; align-items:center; gap:8px; padding:7px 11px;
  border-radius:var(--radius); background:var(--c-dark); color:var(--c-light); font:500 20px/1 var(--font-mono); white-space:nowrap; }
#{{ID}}-ff path { fill:var(--c-accent); }
#{{ID}}-bar { position:absolute; left:14px; right:14px; bottom:46px; height:5px; border-radius:3px; overflow:hidden;
  background:color-mix(in srgb, var(--c-light) 38%, transparent); }
#{{ID}}-fill { display:block; height:100%; width:100%; background:var(--c-accent); transform-origin:0 0; }
#{{ID}} .{{ID}}-st { position:absolute; left:50%; padding:10px 18px 9px; border:5px solid var(--c-neg-light); border-radius:var(--radius);
  background:var(--c-light); color:var(--c-neg-light); font:500 42px/1 var(--font-mono); letter-spacing:.06em;
  text-transform:uppercase; white-space:nowrap; }
#{{ID}}-s1 { top:150px; }
#{{ID}}-s2 { top:360px; }
#{{ID}}-lb { position:absolute; left:0; right:0; margin:0 auto; top:806px; width:max-content; padding:13px 24px 15px;
  border-radius:calc(var(--radius) * 2); background:var(--c-light); color:var(--c-ink); font-family:var(--font-text);
  font-weight:800; font-size:46px; line-height:1; letter-spacing:-.03em; white-space:nowrap; transform-origin:50% 50%; }
#{{ID}}-lb b { font-weight:800; color:var(--c-accent-light); }
</style>
