<!-- kinetic-hook-front (top layer, over the speaker): kinetic-hook's line one on top for the opening frames, so frame 0
     reads as a thumbnail even while the speaker leans into the type. Same words, size, fit and settle as kinetic-hook's
     line one (it hangs from y 444 in a 232px band from y 212). Light type; a dark copy shows through a per-frame mask
     of wherever the picture under the band is light (masks.png, one 232px band per frame of this window, made from
     the footage by mkmask.py), so the line splits light/dark against the picture instead of wearing an outline.
     fx.js clones the dark copy once per frame. End the window on the frame kinetic-hook's ground cuts in, or when the
     head has dropped below the line if that is later. -->
<div id="{{ID}}-band" data-layout-allow-overlap>
  <div id="{{ID}}-lt" class="{{ID}}-cp" data-layout-allow-overlap><div class="{{ID}}-m" data-layout-allow-overflow><div class="{{ID}}-in"><span class="{{ID}}-t"></span></div></div></div>
  <div id="{{ID}}-dk0" class="{{ID}}-cp {{ID}}-dk" data-layout-allow-overlap><div class="{{ID}}-m" data-layout-allow-overflow><div class="{{ID}}-in"><span class="{{ID}}-t"></span></div></div></div>
</div>
<style>
#{{ID}}-band { position:absolute; left:0; top:212px; width:1080px; height:232px; }
#{{ID}} .{{ID}}-cp { position:absolute; left:0; top:0; width:1080px; height:232px; }
#{{ID}} .{{ID}}-dk { -webkit-mask-image:url(fx/{{ID}}/masks.png); mask-image:url(fx/{{ID}}/masks.png);
  -webkit-mask-size:1080px auto; mask-size:1080px auto; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:0 0; mask-position:0 0; }
#{{ID}} .{{ID}}-m { position:absolute; left:0; top:auto; bottom:0; width:1080px; height:0.8em; overflow:hidden; font-size:290px; }
#{{ID}} .{{ID}}-in { display:block; margin-top:-0.1em; line-height:1; text-align:center; white-space:nowrap;
  font-family:var(--font-display); font-style:var(--display-style); font-weight:var(--display-weight);
  letter-spacing:-0.02em; color:var(--c-light); }
#{{ID}} .{{ID}}-dk .{{ID}}-in { color:var(--c-ink); }
#{{ID}} .{{ID}}-t { display:inline-block; white-space:nowrap; }
</style>
