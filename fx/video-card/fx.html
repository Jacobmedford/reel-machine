<!-- video-card: a video card unfolds, play presses, the chapters skip with a moving clip in each, a scrubber runs,
     the card folds. Words, labels and beat times live in fx.js. Media timing uses the START / SYNC / DUR template
     variables (FX_BRIEF.md, Media timing), so the card times itself wherever it is placed.
     These are PLACEHOLDERS: copies of the project's own clean.mp4 in sync with the main picture (so they exist
     wherever the card sits), one frame apart, the poster creeping at 0.1x. Replace them with clips of your real
     walkthrough: energy.py cuts them and prints the tags (see fx.js). -->
<div id="{{ID}}-card">
  <div id="{{ID}}-shadow"></div>
  <div id="{{ID}}-body">
    <div id="{{ID}}-thumb">
      <video id="{{ID}}-poster" class="{{ID}}-v" src="clean.mp4" muted playsinline data-start="{{START}}" data-media-start="{{SYNC}}" data-duration="{{DUR}}" data-playback-rate="0.1" data-track-index="{{T0}}"></video>
      <video id="{{ID}}-v1" class="{{ID}}-v" src="clean.mp4" muted playsinline data-start="{{START+0.0333}}" data-media-start="{{SYNC+0.0333}}" data-duration="{{DUR-0.0333}}" data-track-index="{{T1}}"></video>
      <video id="{{ID}}-v2" class="{{ID}}-v" src="clean.mp4" muted playsinline data-start="{{START+0.0667}}" data-media-start="{{SYNC+0.0667}}" data-duration="{{DUR-0.0667}}" data-track-index="{{T2}}"></video>
      <video id="{{ID}}-v3" class="{{ID}}-v" src="clean.mp4" muted playsinline data-start="{{START+0.1}}" data-media-start="{{SYNC+0.1}}" data-duration="{{DUR-0.1}}" data-track-index="{{T3}}"></video>
      <video id="{{ID}}-v4" class="{{ID}}-v" src="clean.mp4" muted playsinline data-start="{{START+0.1333}}" data-media-start="{{SYNC+0.1333}}" data-duration="{{DUR-0.1333}}" data-track-index="{{T4}}"></video>
      <div id="{{ID}}-tag"></div>
      <div id="{{ID}}-play"><svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true"><path d="M14 9 L32 20 L14 31 Z"/></svg></div>
      <div id="{{ID}}-bar"><div id="{{ID}}-head"></div></div>
    </div>
    <div id="{{ID}}-meta">
      <div class="{{ID}}-mask" data-layout-allow-overflow><div id="{{ID}}-title"></div></div>
      <div class="{{ID}}-mask" id="{{ID}}-chm" data-layout-allow-overflow></div>
    </div>
  </div>
</div>
<style>
#{{ID}}-card { position:absolute; left:0; top:0; width:760px; height:576px; }
#{{ID}}-shadow { position:absolute; left:0; top:0; width:760px; height:576px; border-radius:var(--radius);
  box-shadow:0 18px 44px color-mix(in srgb, var(--c-dark) 34%, transparent); }
#{{ID}}-body { position:absolute; left:0; top:0; width:760px; height:576px; border-radius:var(--radius); overflow:hidden;
  background:var(--c-dark); }
#{{ID}}-thumb { position:absolute; left:0; top:0; width:760px; height:428px; overflow:hidden; background:var(--c-dark); }
.{{ID}}-v { position:absolute; left:0; top:0; width:760px; height:428px; object-fit:cover; object-position:50% 36%; }
#{{ID}}-tag { position:absolute; left:18px; top:18px; padding:8px 11px 7px; border-radius:calc(var(--radius) * .66);
  background:color-mix(in srgb, var(--c-dark) 74%, transparent); color:var(--c-light); font:500 17px/1 var(--font-mono);
  letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
#{{ID}}-play { position:absolute; left:322px; top:156px; width:116px; height:116px; border-radius:58px; background:var(--c-light);
  display:flex; align-items:center; justify-content:center; }
#{{ID}}-play svg { margin-left:6px; }
#{{ID}}-play path { fill:var(--c-dark); }
#{{ID}}-bar { position:absolute; left:20px; top:398px; width:720px; height:8px; }
.{{ID}}-seg { position:absolute; top:0; height:8px; border-radius:calc(var(--radius) * .66); overflow:hidden;
  background:color-mix(in srgb, var(--c-light) 38%, transparent); }
.{{ID}}-seg i { position:absolute; left:0; top:0; width:100%; height:100%; background:var(--c-light); transform-origin:0 50%; }
#{{ID}}-head { position:absolute; left:-9px; top:-6px; width:20px; height:20px; border-radius:10px; background:var(--c-accent); }
#{{ID}}-meta { position:absolute; left:34px; top:452px; width:692px; }
.{{ID}}-mask { position:relative; overflow:hidden; }
#{{ID}}-title { font-family:var(--font-display); font-style:var(--display-style); font-weight:var(--display-weight); font-size:54px;
  line-height:1.08; letter-spacing:-.01em; color:var(--c-light); white-space:nowrap; padding-bottom:4px; }
#{{ID}}-chm { height:44px; margin-top:6px; }
.{{ID}}-ch { position:absolute; left:0; top:0; height:44px; display:flex; align-items:center; gap:14px; white-space:nowrap;
  font:500 28px/1 var(--font-text); letter-spacing:-.01em; color:color-mix(in srgb, var(--c-light) 86%, transparent); }
.{{ID}}-ch b { font:500 22px/1 var(--font-mono); color:var(--c-accent); letter-spacing:.04em; }
.{{ID}}-ch.{{ID}}-k b { font:700 20px/1 var(--font-text); color:var(--c-light); text-transform:uppercase; letter-spacing:.14em; }
.{{ID}}-ch.{{ID}}-k span { color:var(--c-muted-dark); }
</style>
