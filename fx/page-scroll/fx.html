<!-- page-scroll: a window card slides up with a page in it, two scroll flicks like a screen recording, then one push
     into a single section whose rows light up. fx.js builds the page: a placeholder plan made from this video's own
     lines (words.json) in the creator's tokens, or the tiles of a real page captured with capture.py. -->
<div id="{{ID}}-card" data-layout-allow-overlap data-layout-allow-occlusion>
  <div id="{{ID}}-bar"><span id="{{ID}}-bt"></span><span id="{{ID}}-bd"></span></div>
  <div id="{{ID}}-view" data-layout-allow-overflow>
    <div id="{{ID}}-page" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion></div>
    <i id="{{ID}}-thumb"></i>
  </div>
</div>
<style>
